<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#151f28">
    <title>İsmail ÖKSÜZ | Dijital Kartvizit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="loader" id="loader">
    <div class="loader-photo">
        <div class="loader-ring"></div>
        <img src="https://avatars.githubusercontent.com/u/46068969?v=4" alt="">
    </div>
    <div class="loader-name">İsmail ÖKSÜZ</div>
</div>
<main class="card">
    <section class="profile-section">
        <div class="photo-wrapper">
            <img class="photo" src="https://avatars.githubusercontent.com/u/46068969?v=4" alt="İsmail ÖKSÜZ">
        </div>
        <h1 class="name">
            İsmail ÖKSÜZ
        </h1>
        <div class="title">
            BİLGİSAYAR MÜHENDİSİ
        </div>
        <div class="institution">
            T.C. Çerkezköy Belediye Başkanlığı <br> Bilgi İşlem Müdürlüğü
        </div>
    </section>
    <section class="contact-section">
        <div class="contact-list">
            <a class="contact-item" href="tel:+905382342550" aria-label="İsmail Öksüz'ü ara">
                <div class="icon">
                    <i class="fa-solid fa-phone"></i>
                </div>
                <div class="contact-content">
                    <span class="contact-label">
                        TELEFON
                    </span>
                    <span class="contact-value">
                        +90 538 234 25 50
                    </span>
                </div>
            </a>
            <a class="contact-item" href="mailto:ismail.oksuz@cerkezkoy.bel.tr" aria-label="İsmail Öksüz'e e-posta gönder">
                <div class="icon">
                    <i class="fa-regular fa-envelope"></i>
                </div>
                <div class="contact-content">
                    <span class="contact-label">
                        E-POSTA
                    </span>
                    <span class="contact-value">
                        ismail.oksuz@cerkezkoy.bel.tr
                    </span>
                </div>
            </a>
        </div>
    </section>
</main>
<div class="top-actions">
    <a class="action-btn" href="vcard/vcard.vcf" download="vcard.vcf" aria-label="Rehbere Kaydet" title="Rehbere Kaydet">
        <i class="fa-solid fa-user-plus"></i>
    </a>
    <button class="action-btn" id="openShareModal" aria-label="Paylaş" title="Paylaş">
        <i class="fa-solid fa-share-nodes"></i>
    </button>
</div>
<a class="portfolio-btn" href="https://ismailoksuz.github.io/ismail-oksuz/" target="_blank" rel="noopener" aria-label="Portfolyo" title="Portfolyo">
    <i class="fa-solid fa-microchip"></i>
    <span>Portfolyo</span>
</a>
<div class="modal-overlay" id="shareModal">
    <div class="modal-content">
        <button class="modal-close" id="closeShareModal" aria-label="Kapat">&times;</button> 
        <h2 class="modal-title">Paylaş</h2>
        <div class="qr-container">
            <img src="vcard/vcard.png" alt="vCard QR Kod">
        </div>
        <div class="share-grid">
            <a class="share-grid-item" id="waShare" href="#" target="_blank" rel="noopener">
                <div class="share-icon wa">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>
                <span>WhatsApp</span>
            </a>
            <a class="share-grid-item" id="smsShare" href="#">
                <div class="share-icon sms">
                    <i class="fa-solid fa-comment-sms"></i>
                </div>
                <span>SMS</span>
            </a>
            <a class="share-grid-item" id="tgShare" href="#" target="_blank" rel="noopener">
                <div class="share-icon tg">
                    <i class="fa-brands fa-telegram"></i>
                </div>
                <span>Telegram</span>
            </a>
            <a class="share-grid-item" id="mailShare" href="#">
                <div class="share-icon mail">
                    <i class="fa-regular fa-envelope"></i>
                </div>
                <span>E-posta</span>
            </a>
        </div>
        <button class="copy-link-btn" id="copyLinkBtn">
            <i class="fa-regular fa-copy"></i>
            <span id="copyBtnText">Bağlantıyı Kopyala</span>
        </button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
